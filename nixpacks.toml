[variables]
NIXPACKS_NO_DEFAULT_CACHE_DIRECTORIES = "1"

[phases.setup]
nixpkgs = ["nodejs_22"]

[phases.install]
cmds = [
  "rm -rf node_modules server/node_modules clean-sarahs-pilates-client/node_modules",
  "npm ci --include=dev"
]

[phases.build]
cmds = [
  "cd clean-sarahs-pilates-client && npm run build",
  "cd server && npm run build"
]

[start]
cmd = "node server/dist/index.js"
